<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editing Appointment</title>
    
    <style>
    
        body {
            font-family: 'techno font', techno font;
            margin: 60;
            padding: 50;
            background: linear-gradient(to right, #002366, #9370DB, #feb47b,#ff66cc,#90EE90,#002366);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(5, 3, 8, 6.3);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 3.5em;
            text-shadow: 15px 15px 15px rgba(5,3,8,6.3);
            text-color:purple;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold,underline;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 15px;
            border-radius: 10px;
            background: rgba(2505, 2055, 2505, 0.2);
            color: #fff;
            box-sizing: border-box; /* To include padding in the width */
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(to right, #ff7e5f,#800080 );
            color:black;
            font-size: 1.7em;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 10px 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background: linear-gradient(to right, #feb47b, #ff7e5f);
        }

        .mehndi-designs {
            display: flex;
            justify-content: space-around;
            margin-top: 70px;
        }

        .mehndi-designs img {
            width: 100px;
            height: 100px;
            border-radius: 05px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 14px 16px rgba(0, 0, 0, 0.1);
        }

        .mehndi-designs img:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 12px rgba(4, 6, 7, 0.2);
        }

        .error-message {
            color: #ffdddd;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Book Your Video Editing Appointment</h1>
        <center> <img src="img 4.jpg" height="250" width="425" ></center>
        <div class="icons">

</div>
        
        
        
        <form id="appointmentForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <div class="error-message" id="nameError"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                <div class="error-message" id="phoneError"></div>
            </div>
            <div class="form-group">
                <label for="date">Appointment Date</label>
                <input type="date" id="date" name="date" required>
                <div class="error-message" id="dateError"></div>
            </div>
            <div class="form-group">
                <label for="time">Appointment Time</label>
                <input type="time" id="time" name="time" required>
                <div class="error-message" id="timeError"></div>
                <h5>Upload Your Image How You Want </h5>
                <input type="file">
            </div>
            <div class="form-group">
                <label for="design">Choose a Design Style</label>
                <select id="design" name="design">
                    <option value="photo editing">Photo Editing</option>
                    <option value="video editing">Video Editing</option>
                    <option value="graphics work">Graphics Work</option>
                    <option value="logo make">Logo Make</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Additional Requests</label>
                <textarea id="message" name="message" rows="4" placeholder="Any special requests or details..."></textarea>
            </div>
            <button type="submit">Book Appointment</button>
        </form>
        <div class="mehndi-designs">
            <img src="img 5.jpg" >
            <img src="img 6.jpg" >
            <img src="img 4.jpg" >
           
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('appointmentForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            const dateInput = document.getElementById('date');
            const timeInput = document.getElementById('time');

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const phoneError = document.getElementById('phoneError');
            const dateError = document.getElementById('dateError');
            const timeError = document.getElementById('timeError');

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                let isValid = true;

                // Name validation
                if (nameInput.value.trim() === '') {
                    nameError.textContent = 'Please enter your full name.';
                    nameError.style.display = 'block';
                    isValid = false;
                } else {
                    nameError.style.display = 'none';
                }

                // Email validation
                if (!/^\S+@\S+\.\S+$/.test(emailInput.value)) {
                    emailError.textContent = 'Please enter a valid email address.';
                    emailError.style.display = 'block';
                    isValid = false;
                } else {
                    emailError.style.display = 'none';
                }

                // Phone validation
                if (!/^\d{10}$/.test(phoneInput.value)) {
                    phoneError.textContent = 'Please enter a valid 10-digit phone number.';
                    phoneError.style.display = 'block';
                    isValid = false;
                } else {
                    phoneError.style.display = 'none';
                }

                // Date validation
                if (dateInput.value === '') {
                    dateError.textContent = 'Please select a date.';
                    dateError.style.display = 'block';
                    isValid = false;
                } else {
                    dateError.style.display = 'none';
                }

                 // Time validation
                 if (timeInput.value === '') {
                    timeError.textContent = 'Please select a time.';
                    timeError.style.display = 'block';
                    isValid = false;
                } else {
                    timeError.style.display = 'none';
                }


                if (isValid) {
                    alert('Appointment booked successfully!');
                    form.reset();
                }
            });
        });
    </script>

</body>
</html>
